<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="An interactive study of heat, care, and the space a body needs.">
  <title>BODY / DATA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23111' d='M0 0h64v64H0z'/%3E%3Ctext x='8' y='49' fill='white' font-family='Helvetica,Arial' font-size='49' font-weight='900'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=5.1.0">
</head>
<body data-state="idle" data-theme="menu">
  <canvas id="stage" aria-label="Interactive artwork"></canvas>
  <video id="camera" autoplay playsinline muted aria-hidden="true"></video>
  <header class="masthead">
    <div class="header-right">
      <span id="demo-badge" class="demo-badge" hidden></span>
      <div class="language-control">
        <label for="language" class="sr-only" id="language-label">Language</label>
        <select id="language" aria-label="Language">
          <option value="en">ENGLISH</option>
          <option value="es">ESPAÑOL</option>
          <option value="fr">FRANÇAIS</option>
          <option value="zh">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="ar">العربية</option>
        </select>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
      </div>
    </div>
  </header>
  <main>
    <section id="entrance" class="entrance">
      <h1 id="entrance-title">HOW MUCH<br>CAN YOU<br>TAKE<span class="period">.</span></h1>
      <div class="entrance-bottom">
        <button id="restart-camera" class="icon-button" aria-label="Restart camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h12v12H3zM15 10l6-3v10l-6-3"/></svg></button>
        <button id="preview" class="text-button">PREVIEW</button>
      </div>
    </section>
    <div id="cube-scene" class="cube-scene" role="img" aria-label="Six-sided gesture selector">
      <div id="cube" class="cube">
        <div class="cube-face front"><span>SHELTER<br>SHELTER<br>SHELTER<br>SHELTER</span></div>
        <div class="cube-face back"><span>SPACE<br>SPACE<br>SPACE<br>SPACE</span></div>
        <div class="cube-face right"><span>HOLD<br>HOLD<br>HOLD<br>HOLD</span></div>
        <div class="cube-face left"><span>SPACE<br>SPACE<br>SPACE<br>SPACE</span></div>
        <div class="cube-face top"><span>HOLD<br>HOLD<br>HOLD<br>HOLD</span></div>
        <div class="cube-face bottom"><span>SHELTER<br>SHELTER<br>SHELTER<br>SHELTER</span></div>
      </div>
    </div>
    <div id="cube-guidance"><p id="cube-caption"></p><p id="menu-hint" class="menu-hint"></p><div id="grip-progress"></div></div>
    <div id="scan-copy" class="scan-copy" hidden>
      <h2 id="scan-title">A BODY<br>IN VIEW.</h2>
      <div class="scan-progress"><div id="scan-progress-fill"></div></div>
    </div>
    <section id="briefing" class="briefing" hidden>
      <div class="brief-heading"><span id="brief-symbol"></span><h2 id="brief-title"></h2><p id="brief-scope"></p></div>
      <div id="brief-facts" class="brief-facts"></div>
      <p id="brief-unit" class="brief-unit"></p>
      <div class="brief-bottom"><div class="brief-instruction"><span id="brief-gesture"></span><div><p id="brief-action"></p><p id="brief-note"></p></div></div><div id="brief-progress" aria-hidden="true"><i></i></div></div>
      <p id="brief-source" class="brief-source"></p>
    </section>
    <section id="alignment" class="alignment" hidden><h2 id="align-title"></h2><p id="align-action"></p><strong id="countdown" aria-live="polite"></strong><p id="align-status" role="status"></p></section>
    <div id="error" class="error-screen" hidden role="alert">
      <h2 id="error-title"></h2>
      <p id="error-message"></p>
      <button id="retry" class="enter-button"></button>
    </div>
  </main>
  <div id="hand-cursor" class="hand-cursor" hidden aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="pointer-target" cx="22" cy="22" r="10"/><circle class="cursor-ring" cx="22" cy="22" r="18"/><circle cx="22" cy="22" r="3"/></svg></div>
  <div id="scene-context" class="scene-context" hidden><div id="live-stats" class="live-stats"></div><p id="context-unit"></p><p id="context-scope"></p></div>
  <div id="coach" class="coach" hidden><span id="coach-icon"></span><p id="coach-text"></p></div>
  <button id="back" class="back-button" hidden aria-label="Back"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M30 12H3m9-9-9 9 9 9"/></svg></button>
      <button id="fullscreen" class="icon-button" aria-label="Fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
  <footer class="footer">
    <div class="footer-left" hidden><span id="scope">WORLD</span><span id="status">THREE ENCOUNTERS</span></div>
    <div class="footer-right">
      <button id="sources-toggle" class="text-button" aria-haspopup="dialog">DATA</button>
      <button id="end" class="text-button" hidden>END</button>

    </div>
  </footer>
  <dialog id="sources-dialog" class="sources-dialog">
    <div class="dialog-heading"><h2 id="sources-title">DATA</h2><button id="sources-close" class="icon-button" aria-label="Close">×</button></div>
    <p id="sources-scope" class="source-scope"></p>
    <div id="source-list"></div>
  </dialog>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <script src="./vendor/matter.min.js"></script>
  <script type="module" src="./src/app.js?v=5.1.0"></script>
</body>
</html>
