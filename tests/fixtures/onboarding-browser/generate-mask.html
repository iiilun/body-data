<!doctype html><html lang="en"><meta charset="utf-8"><title>Official sample alignment mask</title><style>body{background:#111;color:white;font:18px Helvetica;padding:40px}button,a{font:inherit;color:inherit;padding:12px;border:1px solid white;background:transparent}img{display:block;max-height:420px;margin:30px 0}pre{white-space:pre-wrap}</style><h1>Official sample alignment mask</h1><p>Google MediaPipe sample photograph. No live camera.</p><button id="generate">Generate mask</button><img id="sample" src="../assets/alignment-preview.jpg"><pre id="status" role="status">Ready</pre><a id="result" hidden download="alignment-mask.json">Download verified mask</a><script type="module">
const image=document.querySelector('#sample'),status=document.querySelector('#status'),button=document.querySelector('#generate'),result=document.querySelector('#result');
button.onclick=async()=>{button.disabled=true;await image.decode();status.textContent='Loading local models';const worker=new Worker('../vision-worker.js');
worker.onmessage=async({data:r})=>{if(r.type==='progress')status.textContent='Loading local models '+Math.round(r.value*100)+'%';if(r.type==='ready'){status.textContent='Inferring official sample';const bitmap=await createImageBitmap(image,{resizeWidth:480,resizeHeight:Math.round(480*image.naturalHeight/image.naturalWidth)});worker.postMessage({type:'frame',bitmap,timestamp:performance.now(),mode:'active'},[bitmap]);}
if(r.type==='result'){let raw='';for(let i=0;i<r.mask.length;i+=4096)raw+=String.fromCharCode(...r.mask.subarray(i,i+4096));const payload={width:r.width,height:r.height,bytes:btoa(raw),pose:r.landmarks,source:'Google MediaPipe pose.jpg'};result.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload));result.hidden=false;status.textContent=(r.landmarks.length===33&&r.mask.some(v=>v)?'PASS':'FAIL')+' · '+r.landmarks.length+' pose landmarks · '+r.width+' × '+r.height+' mask';worker.terminate();}
if(r.type==='error'||r.type==='frame-error')status.textContent='FAIL '+r.message;};worker.onerror=e=>status.textContent='FAIL '+e.message;worker.postMessage({type:'init'});};
</script></html>
